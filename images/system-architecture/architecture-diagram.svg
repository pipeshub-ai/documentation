<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" role="img" aria-labelledby="title desc">
  <title id="title">PipesHub architecture</title>
  <desc id="desc">Three tiers. Presentation is the Next.js web app and MCP clients. Application is the Node.js API with in-process modules, an event bus of Redis Streams or Kafka, and Python query, indexing, and connector services plus a local embedding server. Data is Qdrant, Neo4j or ArangoDB, MongoDB, files, and Redis, with etcd optional.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="9" orient="auto">
      <path d="M0 1.5 L11 6 L0 10.5 Z" fill="#444"/>
    </marker>
    <marker id="arrow-rev" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="8" markerHeight="9" orient="auto">
      <path d="M12 1.5 L1 6 L12 10.5 Z" fill="#444"/>
    </marker>
    <style>
      .title { font: 700 28px ui-sans-serif, system-ui, sans-serif; fill: #111; }
      .tier { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #333; }
      .h { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: #111; }
      .h2 { font: 700 16px ui-sans-serif, system-ui, sans-serif; fill: #111; }
      .s { font: 14px ui-sans-serif, system-ui, sans-serif; fill: #333; }
      .s2 { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #444; }
      .tiny { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #555; }
      .ext { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #222; }
    </style>
  </defs>
  <rect x="4" y="4" width="1192" height="972" rx="8" fill="#fbfbfc" stroke="#d5d9de" stroke-width="1.5"/>

