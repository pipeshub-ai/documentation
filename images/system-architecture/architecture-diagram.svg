<text x="664" y="195" text-anchor="middle" class="s">Storage</text>
<rect x="730" y="176" width="112" height="28" rx="3" fill="#eee" stroke="#999" stroke-width="1"/>
<text x="786" y="195" text-anchor="middle" class="s">Config</text>
<rect x="486" y="210" width="112" height="28" rx="3" fill="#eee" stroke="#999" stroke-width="1"/>
<text x="542" y="229" text-anchor="middle" class="s">Mail</text>
<rect x="606" y="210" width="112" height="28" rx="3" fill="#eee" stroke="#999" stroke-width="1"/>
<text x="662" y="229" text-anchor="middle" class="s">Notifications</text>
<rect x="726" y="210" width="112" height="28" rx="3" fill="#eee" stroke="#999" stroke-width="1"/>
<text x="782" y="229" text-anchor="middle" class="s">Crawling</text>
<rect x="168" y="270" width="790" height="66" rx="8" fill="#e4e4e4" stroke="#555" stroke-width="1.4"/>
<text x="565" y="296" text-anchor="middle" class="h">Event bus</text>
<text x="565" y="318" text-anchor="middle" class="s">Redis Streams locally, or Kafka in a larger deployment</text>
<rect x="150" y="384" width="128" height="124" rx="6" fill="#f3f3f3" stroke="#666" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="214" y="412" text-anchor="middle" class="h2">Embedding</text>
<text x="214" y="434" text-anchor="middle" class="s">local vectors</text>
<text x="214" y="456" text-anchor="middle" class="tiny">HTTP from Query</text>
<text x="214" y="474" text-anchor="middle" class="tiny">and Indexing</text>
<text x="214" y="492" text-anchor="middle" class="tiny">skip if cloud</text>
<rect x="292" y="362" width="218" height="148" rx="6" fill="#fff" stroke="#333" stroke-width="1.6"/>
<text x="401" y="396" text-anchor="middle" class="h">Query</text>
<text x="401" y="422" text-anchor="middle" class="s">Python FastAPI</text>
<text x="401" y="444" text-anchor="middle" class="s">retrieve, cite, LLM</text>
<text x="401" y="478" text-anchor="middle" class="tiny">reads graph + vectors</text>
<rect x="528" y="362" width="218" height="148" rx="6" fill="#fff" stroke="#333" stroke-width="1.6"/>
<text x="637" y="396" text-anchor="middle" class="h">Indexing</text>
<text x="637" y="422" text-anchor="middle" class="s">Python FastAPI</text>
<text x="643" y="444" text-anchor="middle" class="s">parse, chunk, embed</text>
<text x="637" y="478" text-anchor="middle" class="tiny">Docling: PDF, tables, OCR</text>
<rect x="764" y="362" width="218" height="148" rx="6" fill="#fff" stroke="#333" stroke-width="1.6"/>
<text x="873" y="396" text-anchor="middle" class="h">Connectors</text>
<text x="873" y="422" text-anchor="middle" class="s">Python FastAPI</text>
<text x="873" y="444" text-anchor="middle" class="s">OAuth, sync</text>
<text x="873" y="478" text-anchor="middle" class="tiny">Slack, Drive, Jira...</text>
<rect x="160" y="820" width="158" height="90" rx="5" fill="#d4d4d4" stroke="#555" stroke-width="1.2"/>
