<text x="239" y="868" text-anchor="middle" class="s">Qdrant</text>
<text x="239" y="888" text-anchor="middle" class="tiny">default</text>
<rect x="332" y="820" width="158" height="90" rx="5" fill="#d4d4d4" stroke="#555" stroke-width="1.2"/>
<text x="411" y="848" text-anchor="middle" class="h2">Graph DB</text>
<text x="411" y="868" text-anchor="middle" class="s">Neo4j default</text>
<text x="411" y="888" text-anchor="middle" class="tiny">or ArangoDB</text>
<rect x="504" y="820" width="158" height="90" rx="5" fill="#d4d4d4" stroke="#555" stroke-width="1.2"/>
<text x="583" y="848" text-anchor="middle" class="h2">Documents</text>
<text x="583" y="868" text-anchor="middle" class="s">MongoDB</text>
<text x="583" y="888" text-anchor="middle" class="tiny">sessions, metadata</text>
<rect x="676" y="820" width="158" height="90" rx="5" fill="#d4d4d4" stroke="#555" stroke-width="1.2"/>
<text x="755" y="848" text-anchor="middle" class="h2">Files</text>
