<polygon points="10,72 104,72 122,97.0 104,122 10,122" fill="#fff" stroke="#c45c5c" stroke-width="2"/>
<text x="60" y="92" text-anchor="middle" class="tier">Presentation</text>
<text x="60" y="110" text-anchor="middle" class="tier">Tier</text>
<polygon points="10,360 104,360 122,385.0 104,410 10,410" fill="#fff" stroke="#c45c5c" stroke-width="2"/>
<text x="60" y="380" text-anchor="middle" class="tier">Application</text>
<text x="60" y="398" text-anchor="middle" class="tier">Tier</text>
<polygon points="10,820 104,820 122,845.0 104,870 10,870" fill="#fff" stroke="#c45c5c" stroke-width="2"/>
<text x="60" y="840" text-anchor="middle" class="tier">Data</text>
<text x="60" y="858" text-anchor="middle" class="tier">Tier</text>
<rect x="10" y="560" width="112" height="118" rx="6" fill="#d8d9db" stroke="#666" stroke-width="1.2"/>
<text x="66" y="588" text-anchor="middle" class="h2">AI models</text>
<text x="66" y="608" text-anchor="middle" class="s2">you bring</text>
<text x="66" y="632" text-anchor="middle" class="s">Embed + LLM</text>
<text x="66" y="654" text-anchor="middle" class="tiny">any / Ollama</text>
<rect x="128" y="88" width="868" height="860" rx="36" fill="#fff" stroke="#2a2a2a" stroke-width="2"/>
<rect x="270" y="50" width="250" height="60" rx="6" fill="#e4e4e4" stroke="#555" stroke-width="1.4"/>
<text x="395" y="76" text-anchor="middle" class="h">Web app in browser</text>
<text x="395" y="96" text-anchor="middle" class="s2">Next.js - search, chat, admin</text>
<rect x="540" y="50" width="250" height="60" rx="6" fill="#e4e4e4" stroke="#555" stroke-width="1.4"/>
<text x="665" y="76" text-anchor="middle" class="h">MCP clients / agents</text>
<text x="665" y="96" text-anchor="middle" class="s2">same permissions as a user</text>
<text x="395" y="130" text-anchor="middle" class="tiny">REST APIs, SSE</text>
<text x="665" y="130" text-anchor="middle" class="tiny">HTTP, Bearer /mcp</text>
<rect x="200" y="150" width="250" height="92" rx="6" fill="#fff" stroke="#333" stroke-width="1.6"/>
<text x="325" y="180" text-anchor="middle" class="h">Node.js API</text>
<text x="325" y="202" text-anchor="middle" class="s">accounts, KBs, files</text>
<text x="325" y="222" text-anchor="middle" class="s">OAuth, PATs, /mcp</text>
<rect x="470" y="142" width="390" height="104" rx="6" fill="#fff" stroke="#333" stroke-width="1.6"/>
<text x="665" y="164" text-anchor="middle" class="h2">API modules (same process)</text>
