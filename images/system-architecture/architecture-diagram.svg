<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2084 1186" role="img" aria-labelledby="title desc">
  <title id="title">PipesHub architecture</title>
  <desc id="desc">Three tiers. Presentation is the Next.js web app and MCP clients. Application is the Node.js API with in-process modules, an event bus of Redis Streams or Kafka, and Python query, indexing, and connector services plus a local embedding server. Data is Qdrant, Neo4j or ArangoDB, MongoDB, files, and Redis, with etcd optional.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="10" orient="auto">
      <path d="M0 1.5 L11 6 L0 10.5 Z" fill="#444"/>
    </marker>
    <marker id="arrow-rev" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="10" orient="auto">
      <path d="M12 1.5 L1 6 L12 10.5 Z" fill="#444"/>
    </marker>
    <filter id="soft" x="-4%" y="-2%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#000" flood-opacity="0.09"/>
    </filter>
    <style>
      .title { font: 700 32px ui-sans-serif, system-ui, sans-serif; fill: #111; }
      .tier { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #333; }
      .h { font: 700 16px ui-sans-serif, system-ui, sans-serif; fill: #111; }
      .h2 { font: 700 14px ui-sans-serif, system-ui, sans-serif; fill: #111; }
      .s { font: 12.5px ui-sans-serif, system-ui, sans-serif; fill: #333; }
      .s2 { font: 11.5px ui-sans-serif, system-ui, sans-serif; fill: #444; }
      .cap { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #555; }
      .tiny { font: 10.5px ui-sans-serif, system-ui, sans-serif; fill: #555; }
      .ext { font: 12.5px ui-sans-serif, system-ui, sans-serif; fill: #222; }
    </style>
  </defs>

  <rect x="8" y="8" width="2068" height="1170" rx="8" fill="#fbfbfc" stroke="#d5d9de" stroke-width="1.5"/>
  <text x="1042" y="46" text-anchor="middle" class="title">Architecture Diagram</text>

  <polygon points="24,78 160,78 182,106 160,134 24,134" fill="#fff" stroke="#c45c5c" stroke-width="2"/>
  <text x="98" y="102" text-anchor="middle" class="tier">Presentation</text>
  <text x="98" y="120" text-anchor="middle" class="tier">Tier</text>

  <polygon points="24,430 160,430 182,458 160,486 24,486" fill="#fff" stroke="#c45c5c" stroke-width="2"/>
  <text x="98" y="454" text-anchor="middle" class="tier">Application</text>
  <text x="98" y="472" text-anchor="middle" class="tier">Tier</text>

  <polygon points="24,980 160,980 182,1008 160,1036 24,1036" fill="#fff" stroke="#c45c5c" stroke-width="2"/>
  <text x="98" y="1004" text-anchor="middle" class="tier">Data</text>
  <text x="98" y="1022" text-anchor="middle" class="tier">Tier</text>

  <g filter="url(#soft)">
    <rect x="22" y="700" width="162" height="124" rx="6" fill="#d8d9db" stroke="#666" stroke-width="1.2"/>
    <text x="103" y="730" text-anchor="middle" class="h2">AI models</text>
    <text x="103" y="750" text-anchor="middle" class="s2">you bring</text>
    <text x="103" y="776" text-anchor="middle" class="s">Embedding + LLM</text>
    <text x="103" y="796" text-anchor="middle" class="tiny">any provider or Ollama</text>
  </g>

  <rect x="210" y="128" width="1450" height="1010" rx="58" fill="#fff" stroke="#2a2a2a" stroke-width="2.2"/>

  <g filter="url(#soft)">
    <rect x="500" y="74" width="310" height="66" rx="6" fill="#e4e4e4" stroke="#555" stroke-width="1.4"/>
    <text x="655" y="102" text-anchor="middle" class="h">Web app in browser</text>
    <text x="655" y="124" text-anchor="middle" class="s2">Next.js  -  search, chat, admin</text>
  </g>
  <g filter="url(#soft)">
    <rect x="840" y="74" width="280" height="66" rx="6" fill="#e4e4e4" stroke="#555" stroke-width="1.4"/>
    <text x="980" y="102" text-anchor="middle" class="h">MCP clients / agents</text>
    <text x="980" y="124" text-anchor="middle" class="s2">same permissions as a user</text>
  </g>
  <text x="655" y="166" text-anchor="middle" class="cap">REST APIs, SSE</text>
  <text x="980" y="166" text-anchor="middle" class="cap">HTTP, Bearer  /mcp</text>

  <g filter="url(#soft)">
    <rect x="400" y="188" width="310" height="96" rx="6" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <text x="555" y="224" text-anchor="middle" class="h">Node.js API</text>
    <text x="555" y="246" text-anchor="middle" class="s">accounts, permissions, KBs, files</text>
    <text x="555" y="266" text-anchor="middle" class="s">OAuth, PATs, /mcp</text>
  </g>

  <g filter="url(#soft)">
    <rect x="760" y="180" width="470" height="112" rx="6" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <text x="995" y="202" text-anchor="middle" class="h2">API modules (same process, not microservices)</text>
    <rect x="778" y="214" width="138" height="28" rx="3" fill="#eee" stroke="#999"/>
    <text x="847" y="233" text-anchor="middle" class="s">Auth</text>
    <rect x="926" y="214" width="138" height="28" rx="3" fill="#eee" stroke="#999"/>
    <text x="995" y="233" text-anchor="middle" class="s">Storage</text>
    <rect x="1074" y="214" width="138" height="28" rx="3" fill="#eee" stroke="#999"/>
    <text x="1143" y="233" text-anchor="middle" class="s">Config</text>
    <rect x="778" y="248" width="138" height="28" rx="3" fill="#eee" stroke="#999"/>
    <text x="847" y="267" text-anchor="middle" class="s">Mail</text>
    <rect x="926" y="248" width="138" height="28" rx="3" fill="#eee" stroke="#999"/>
    <text x="995" y="267" text-anchor="middle" class="s">Notifications</text>
    <rect x="1074" y="248" width="138" height="28" rx="3" fill="#eee" stroke="#999"/>
    <text x="1143" y="267" text-anchor="middle" class="s">Crawling</text>
  </g>

  <g filter="url(#soft)">
    <rect x="270" y="336" width="1180" height="74" rx="8" fill="#e4e4e4" stroke="#555" stroke-width="1.4"/>
    <text x="860" y="366" text-anchor="middle" class="h">Event bus</text>
    <text x="860" y="390" text-anchor="middle" class="s">Redis Streams on a local machine, or Kafka in a larger deployment</text>
  </g>

  <!-- Embedding is HTTP, not on the bus -->
  <g filter="url(#soft)">
    <rect x="240" y="490" width="168" height="128" rx="6" fill="#f3f3f3" stroke="#666" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="324" y="522" text-anchor="middle" class="h2">Embedding</text>
    <text x="324" y="544" text-anchor="middle" class="s">local vectors</text>
    <text x="324" y="566" text-anchor="middle" class="tiny">HTTP from Query</text>
    <text x="324" y="584" text-anchor="middle" class="tiny">and Indexing</text>
    <text x="324" y="602" text-anchor="middle" class="tiny">skip if cloud embedder</text>
  </g>

  <g filter="url(#soft)">
    <rect x="430" y="470" width="300" height="148" rx="6" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <text x="580" y="508" text-anchor="middle" class="h">Query</text>
    <text x="580" y="534" text-anchor="middle" class="s">Python FastAPI</text>
    <text x="580" y="556" text-anchor="middle" class="s">retrieve, cite, LLM answer</text>
    <text x="580" y="586" text-anchor="middle" class="tiny">reads graph + vectors</text>
  </g>
  <g filter="url(#soft)">
    <rect x="760" y="470" width="300" height="148" rx="6" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <text x="910" y="508" text-anchor="middle" class="h">Indexing</text>
    <text x="910" y="534" text-anchor="middle" class="s">Python FastAPI</text>
    <text x="910" y="556" text-anchor="middle" class="s">parse, chunk, embed</text>
    <text x="910" y="586" text-anchor="middle" class="tiny">Docling for PDF, tables, OCR</text>
  </g>
  <g filter="url(#soft)">
    <rect x="1090" y="470" width="300" height="148" rx="6" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <text x="1240" y="508" text-anchor="middle" class="h">Connectors</text>
    <text x="1240" y="534" text-anchor="middle" class="s">Python FastAPI</text>
    <text x="1240" y="556" text-anchor="middle" class="s">OAuth, token refresh, sync</text>
    <text x="1240" y="586" text-anchor="middle" class="tiny">Slack, Drive, Jira, Confluence...</text>
  </g>

  <g filter="url(#soft)">
    <rect x="250" y="990" width="204" height="96" rx="5" fill="#d4d4d4" stroke="#555" stroke-width="1.2"/>
    <text x="352" y="1022" text-anchor="middle" class="h2">Vector DB</text>
    <text x="352" y="1044" text-anchor="middle" class="s">Qdrant</text>
    <text x="352" y="1064" text-anchor="middle" class="tiny">default</text>
  </g>
  <g filter="url(#soft)">
    <rect x="474" y="990" width="204" height="96" rx="5" fill="#d4d4d4" stroke="#555" stroke-width="1.2"/>
    <text x="576" y="1022" text-anchor="middle" class="h2">Graph DB</text>
    <text x="576" y="1044" text-anchor="middle" class="s">Neo4j default</text>
    <text x="576" y="1064" text-anchor="middle" class="tiny">or ArangoDB</text>
  </g>
  <g filter="url(#soft)">
    <rect x="698" y="990" width="204" height="96" rx="5" fill="#d4d4d4" stroke="#555" stroke-width="1.2"/>
    <text x="800" y="1022" text-anchor="middle" class="h2">Documents</text>
    <text x="800" y="1044" text-anchor="middle" class="s">MongoDB</text>
    <text x="800" y="1064" text-anchor="middle" class="tiny">sessions, metadata</text>
  </g>
  <g filter="url(#soft)">
    <rect x="922" y="990" width="204" height="96" rx="5" fill="#d4d4d4" stroke="#555" stroke-width="1.2"/>
    <text x="1024" y="1022" text-anchor="middle" class="h2">Files</text>
    <text x="1024" y="1044" text-anchor="middle" class="s">disk, S3, Azure Blob, GCS</text>
    <text x="1024" y="1064" text-anchor="middle" class="tiny">local or object storage</text>
  </g>
  <g filter="url(#soft)">
    <rect x="1146" y="990" width="204" height="96" rx="5" fill="#d4d4d4" stroke="#555" stroke-width="1.2"/>
    <text x="1248" y="1018" text-anchor="middle" class="h2">Redis</text>
    <text x="1248" y="1040" text-anchor="middle" class="s">cache, default KV</text>
    <text x="1248" y="1060" text-anchor="middle" class="tiny">etcd optional for KV</text>
  </g>

  <ellipse cx="1800" cy="170" rx="82" ry="34" fill="#e6e4e4" stroke="#888"/>
  <text x="1800" y="176" text-anchor="middle" class="ext">SMTP</text>
  <ellipse cx="1948" cy="214" rx="82" ry="34" fill="#e6e4e4" stroke="#888"/>
  <text x="1948" y="220" text-anchor="middle" class="ext">Azure AD</text>
  <ellipse cx="1800" cy="252" rx="82" ry="34" fill="#e6e4e4" stroke="#888"/>
  <text x="1800" y="258" text-anchor="middle" class="ext">Okta</text>
  <text x="1874" y="302" text-anchor="middle" class="tiny">and other IdPs</text>

  <rect x="1698" y="430" width="12" height="290" rx="4" fill="#cfcfcf" stroke="#999"/>
  <ellipse cx="1834" cy="448" rx="88" ry="30" fill="#e6e4e4" stroke="#888"/>
  <text x="1834" y="454" text-anchor="middle" class="ext">SharePoint</text>
  <ellipse cx="1968" cy="500" rx="80" ry="30" fill="#e6e4e4" stroke="#888"/>
  <text x="1968" y="506" text-anchor="middle" class="ext">Outlook</text>
  <ellipse cx="1834" cy="532" rx="88" ry="30" fill="#e6e4e4" stroke="#888"/>
  <text x="1834" y="538" text-anchor="middle" class="ext">Slack</text>
  <ellipse cx="1968" cy="584" rx="80" ry="30" fill="#e6e4e4" stroke="#888"/>
  <text x="1968" y="590" text-anchor="middle" class="ext">Jira</text>
  <ellipse cx="1834" cy="616" rx="88" ry="30" fill="#e6e4e4" stroke="#888"/>
  <text x="1834" y="622" text-anchor="middle" class="ext">Confluence</text>
  <ellipse cx="1968" cy="668" rx="80" ry="30" fill="#e6e4e4" stroke="#888"/>
  <text x="1968" y="674" text-anchor="middle" class="ext">Drive</text>
  <text x="1890" y="724" text-anchor="middle" class="tiny">50+ connectors</text>

  <line x1="655" y1="140" x2="555" y2="188" stroke="#444" stroke-width="1.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <line x1="900" y1="140" x2="680" y2="188" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="710" y1="236" x2="760" y2="236" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="555" y1="284" x2="555" y2="336" stroke="#444" stroke-width="1.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <line x1="995" y1="292" x2="995" y2="336" stroke="#444" stroke-width="1.4" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>

  <line x1="580" y1="410" x2="580" y2="470" stroke="#444" stroke-width="1.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <line x1="910" y1="410" x2="910" y2="470" stroke="#444" stroke-width="1.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <line x1="1240" y1="410" x2="1240" y2="470" stroke="#444" stroke-width="1.5" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>

  <line x1="408" y1="554" x2="430" y2="544" stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>

