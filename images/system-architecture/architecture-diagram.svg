<text x="755" y="888" text-anchor="middle" class="tiny">local or object</text>
<rect x="848" y="820" width="158" height="90" rx="5" fill="#d4d4d4" stroke="#555" stroke-width="1.2"/>
<text x="927" y="848" text-anchor="middle" class="h2">Redis</text>
<text x="927" y="868" text-anchor="middle" class="s">cache, default KV</text>
<text x="927" y="888" text-anchor="middle" class="tiny">etcd optional</text>
